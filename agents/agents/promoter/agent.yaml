# Lane promoter (U8, KTD10, R22): activates tested rules, with human approval for
# reject and hold_payout rules. Based on the official hello-world-agent-ts template
# (mongodb/agent-engine-examples); the interrupt pattern follows insurance-agent-ts.
name: promoter
description: Lane promoter. Activates a gated candidate rule through Lane's internal API. Suspends for a human approve or decline before activating reject and hold_payout rules.
# src/promoter_agent/main.ts, compiled to dist/promoter_agent/main.js, exports `app`.
entrypoint: promoter_agent.main:app
framework: langgraph
language: typescript
features:
  durable_workflow: true
  memory: false
scaling:
  replicas: 16
sandboxes:
  agent:
    secrets: ["*"]
    tools: []
    # The agent sandbox calls the LLM provider selected by the LLM_API_KEY secret.
    network:
      egress_mode: allow_list
      egress:
        - fqdn: api.openai.com
          ports: [443]
        - fqdn: api.anthropic.com
          ports: [443]
  tool:
    # lane_internal_api reads LANE_BASE_URL and LANE_ROLE_KEY_PROMOTER.
    secrets: ["*"]
    tools:
      - lane_internal_api
    # Before deploy, allow Lane's production host from this directory:
    #   agentengine agent egress add --component tool <lane-host>:443
    # That command switches this sandbox to allow_list.
    network:
      egress_mode: allow_list
      egress:
        - fqdn: lane-seven-phi.vercel.app
          ports: [443]
