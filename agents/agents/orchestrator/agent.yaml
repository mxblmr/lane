# Lane orchestrator (U8, KTD10): drafts contracts, answers players, proposes settlements.
# Based on the official hello-world-agent-ts template (mongodb/agent-engine-examples).
name: orchestrator
description: Lane orchestrator. Drafts a challenge contract from one sentence or asks one clarifying question, answers a player's question from Lane-built context, and proposes settlements that Lane checks.

# src/orchestrator_agent/main.ts, compiled to dist/orchestrator_agent/main.js, exports `app`.
entrypoint: orchestrator_agent.main:app
framework: langgraph
language: typescript

features:
  durable_workflow: true
  memory: false

# 16 replicas so the shared orchestrator session never runs out of sandboxes on stage.
scaling:
  replicas: 16

sandboxes:
  agent:
    secrets: ["*"]
    tools: []
    # The agent sandbox calls the LLM provider selected by the LLM_API_KEY secret.
    network:
      egress_mode: allow_list
      egress:
        - fqdn: api.openai.com
          ports: [443]
        - fqdn: api.anthropic.com
          ports: [443]
  tool:
    secrets: ["*"]
    tools: []
    network:
      egress_mode: deny_all
