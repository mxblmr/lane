# Lane rule-lab (U8, KTD9, KTD10): writes candidate rules and red-team examples.
# Based on the official hello-world-agent-ts template (mongodb/agent-engine-examples).
name: rule-lab
description: Lane rule-lab. Writes a candidate rule from quoted evidence, then proposes and tests it through Lane's internal API, or adds red-team cheat examples. Never activates a rule.
# src/rule_lab_agent/main.ts, compiled to dist/rule_lab_agent/main.js, exports `app`.
entrypoint: rule_lab_agent.main:app
framework: langgraph
language: typescript
features:
  durable_workflow: true
  memory: false
scaling:
  replicas: 16
sandboxes:
  agent:
    secrets: ["*"]
    tools: []
    # Provider access is also declared on the tool sandbox for app.llm calls.
    network:
      egress_mode: allow_list
      egress:
        - fqdn: api.openai.com
          ports: [443]
        - fqdn: api.anthropic.com
          ports: [443]
  tool:
    # lane_internal_api reads LANE_BASE_URL and LANE_ROLE_KEY_RULE_LAB.
    secrets: ["*"]
    tools:
      - lane_internal_api
    # Before deploy, allow Lane's production host from this directory:
    #   agentengine agent egress add --component tool <lane-host>:443
    # That command switches this sandbox to allow_list.
    network:
      egress_mode: allow_list
      egress:
        - fqdn: lane-seven-phi.vercel.app
          ports: [443]
        - fqdn: api.openai.com
          ports: [443]
        - fqdn: api.anthropic.com
          ports: [443]
